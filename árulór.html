<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Árulór.css">
</head>
<body>
<div class="teljes-kepernyo">
  
  <!-- BAL OLDAL: Képek szekció -->
  <div class="bal-hasab">
    <div class="kep-helye">
      <span>KÉP/<br>KÉPEK</span>
    </div>
  </div>

  <!-- JOBB OLDAL: Információs kártyák -->
  <div class="jobb-hasab">
    
    <!-- 1. Név és csillag sáv -->
    <div class="kartya nev-sor">
      <div class="kozep-szoveg">NÉV</div>
    </div>

    <!-- 2. Helyszín és Elérhetőség -->
    <div class="kartya ketoldalas-sor">
      <div class="bal-oldal">
        <span class="focim">HELYSZÍN</span>
      </div>
      <div class="jobb-oldal">
        <span class="focim">ELÉRHETŐSÉG</span>
      </div>
    </div>

    <!-- 3. Leírás sáv -->
    <div class="kartya leiras-sor">
      <div class="leiras-tartalom">
        <span class="focim-kozep">LEÍRÁS</span>
      </div>
    </div>

    <!-- 4. Ár és Értékelés -->
    <div class="kartya ketoldalas-sor sotet-szurke">
      <div class="bal-oldal">
        <span class="focim">ÁR</span>
      </div>
      <div class="jobb-oldal">
        <span class="focim">ÉRTÉKELÉS?</span>
      </div>
    </div>

    <!-- 5. Kommentek -->
    <div class="kartya gomb-sor">
      <div class="kozep-szoveg">KOMMENTEK</div>
    </div>

    <!-- 6. Hozzáadás a bevásárlólistához -->
    <div class="kartya gomb-sor">
      <div class="kozep-szoveg">HOZZÁADÁS A BEVÁSÁRLÓLISTÁHOZ</div>
    </div>

  </div>
</div>

</div>
</body>
</html>
